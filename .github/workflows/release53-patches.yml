name: Prepare .53 update patches
on:
  push:
    branches: [release-53-patches-20261026]
permissions:
  contents: write
jobs:
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      GH_TOKEN: ${{ github.token }}
      PATCH_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools/Build-UpdatePatch.py
            .github
          sparse-checkout-cone-mode: false
      - name: Verify downloads, reconstruct patches and upload to draft
        run: python3 -u .github/release53_patches.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release53-patches-${{ matrix.shard }}
          path: results
          if-no-files-found: warn
          retention-days: 14
